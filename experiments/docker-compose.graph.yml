# Knowledge-graph store for Graph RAG: PostgreSQL 17 + Apache AGE 1.7 (openCypher inside Postgres).
#   docker compose -f docker-compose.graph.yml up -d
#   docker compose -f docker-compose.graph.yml down        (data stays in the volume; add -v to delete it)
# Local development credentials only - the port is bound to localhost.
services:
  age:
    image: apache/age:release_PG17_1.7.0
    container_name: graphrag-age
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag_local_dev
      POSTGRES_DB: graphrag
    ports:
      - "127.0.0.1:5455:5432"
    volumes:
      - age_data:/var/lib/postgresql/data
    command: ["postgres", "-c", "shared_preload_libraries=age", "-c", "work_mem=64MB",
              "-c", "maintenance_work_mem=256MB"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d graphrag"]
      interval: 5s
      retries: 20
    restart: unless-stopped

volumes:
  age_data:
