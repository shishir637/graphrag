<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAG pipeline explorer</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <div class="logo" aria-hidden="true">RAG</div>
    <div>
      <h1>RAG pipeline explorer</h1>
      <p class="sub">Follow your documents and your question through every step, and see what each one does.</p>
    </div>
  </div>
  <div class="status" id="status"></div>
</header>
<div class="flow" id="flow" aria-label="Pipeline overview"></div>
<div class="layout">
  <nav class="steps" id="nav" aria-label="Pipeline steps"></nav>
  <main id="main" tabindex="-1"></main>
</div>
<aside class="job" id="job" hidden aria-live="polite"></aside>
<div class="toast" id="toast" hidden role="status"></div>
<script src="/static/app.js"></script>
</body>
</html>
