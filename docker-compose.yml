# Context Layer, self-hosted.
#   1. cp .env.example .env   and set CL_DB_PASSWORD (no AI model or API key is needed)
#   2. docker compose up -d
#   3. open http://localhost:8080 and create the owner account
# Data lives in the named volumes below; `docker compose down` keeps it (add -v to delete everything).
services:
  app:
    build: .
    image: context-layer:0.9.0
    restart: unless-stopped
    depends_on:
      graphdb: { condition: service_healthy }
    ports:
      - "${CL_BIND:-127.0.0.1}:${CL_PORT:-8080}:8080"
    environment:
      CL_PUBLIC_HOSTS: ${CL_PUBLIC_HOSTS:-}
      CL_PUBLIC_URL: ${CL_PUBLIC_URL:-}
      GRAPH_PG_DSN: host=graphdb port=5432 dbname=graphrag user=rag password=${CL_DB_PASSWORD:?set CL_DB_PASSWORD in .env}
      CL_GRAPH_MODE: ${CL_GRAPH_MODE:-}
      # business definitions, layers, shares and their history (schema cl_defs in the same Postgres as the graph)
      CL_DEFS_DSN: host=graphdb port=5432 dbname=graphrag user=rag password=${CL_DB_PASSWORD:?set CL_DB_PASSWORD in .env}
      # accounts, sessions, keys, activity, settings, access, teams, directory, approvals, sources, quality runs
      # (0.9; an existing var/app.db is copied in once on the first start)
      CL_DATABASE_URL: postgresql://rag@graphdb:5432/graphrag
      CL_DB_PASSWORD: ${CL_DB_PASSWORD:?set CL_DB_PASSWORD in .env}
      # separate workspaces per company (0.9): files of workspaces other than the first, and open sign-up
      CL_FILES_DIR: /app/workspaces
      CL_SIGNUP: ${CL_SIGNUP:-off}
    extra_hosts:
      - "host.docker.internal:host-gateway"    # lets optional AI extraction reach a local model (Ollama) on this machine
    volumes:
      - documents:/app/documents
      - tables:/app/data
      - outputs:/app/outputs
      - search_index:/app/qdrant_data
      - metric_store:/app/sl_store
      - app_data:/app/var
      - workspaces:/app/workspaces
      - semantic_layer:/app/semantic_layer     # reviewed definitions; approvals in the app persist here
      - models:/models

  graphdb:                      # PostgreSQL 17 + Apache AGE: the knowledge graph. Not published outside Docker.
    image: apache/age:release_PG17_1.7.0
    restart: unless-stopped
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: ${CL_DB_PASSWORD:?set CL_DB_PASSWORD in .env}
      POSTGRES_DB: graphrag
    command: ["postgres", "-c", "shared_preload_libraries=age", "-c", "work_mem=64MB", "-c", "maintenance_work_mem=256MB"]
    volumes:
      - graph_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d graphrag"]
      interval: 5s
      retries: 30

  # ---- optional: publish ONLY the MCP endpoint on the internet through Cloudflare (no open ports) ----
  # Quick test (random https://*.trycloudflare.com address, changes on every start, no account needed):
  #   .env: CL_PUBLIC_HOSTS=*.trycloudflare.com      then: docker compose --profile quicktunnel up -d
  #   The address appears in Settings and on the Agents page.
  quicktunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["quicktunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 --url http://app:8080
    depends_on: [app]

  # Fixed address (Cloudflare account + a domain on Cloudflare): create a tunnel in the Cloudflare dashboard,
  # public hostname -> http://app:8080, then in .env: CLOUDFLARE_TUNNEL_TOKEN=..., CL_PUBLIC_HOSTS=<hostname>,
  # CL_PUBLIC_URL=https://<hostname>      then: docker compose --profile tunnel up -d
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on: [app]

  # ---- optional: a free local AI model (Ollama, MIT licence) for proposing the graph's ontology and for
  # AI extraction. Nothing leaves the machine and there is no API cost. About 4 GB of disk for qwen3.5:4b.
  #   docker compose --profile localai up -d ollama
  #   docker compose exec ollama ollama pull qwen3.5:4b
  #   Settings -> AI extraction: Local model, address http://ollama:11434/v1, model qwen3.5:4b
  ollama:
    image: ollama/ollama:latest
    profiles: ["localai"]
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: 10m

volumes:
  workspaces:
  ollama_models:
  documents:
  tables:
  outputs:
  search_index:
  metric_store:
  app_data:
  semantic_layer:
  models:
  graph_data:
