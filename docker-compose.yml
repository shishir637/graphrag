# Context Layer, self-hosted.
#   1. cp .env.example .env   and set CL_DB_PASSWORD and CL_SECRET_KEY (no AI model or API key is needed)
#   2. docker compose up -d
#   3. open http://localhost:8080 and create the owner account
# Data lives in the named volumes below; `docker compose down` keeps it (add -v to delete everything).
#   db      Postgres: workspaces, people, keys, audit, semantic layer, ontology, document groups, facts and
#           document cards, passages, the knowledge graph (plain tables), jobs, connectors, encrypted secrets
#   app_data each workspace's landing zone (documents/ originals, data/ tables as Parquet; a manifest row per file
#            in Postgres), DuckDB's spill folder, and build outputs
#   qdrant  search vectors (one collection; every point carries its workspace)
#   app     web app, REST API and MCP server (CL_ROLE=api: no job workers, no scheduler)
#   worker  the same image running the job workers and the scheduler (CL_ROLE=worker, python -m app.worker);
#           it shares the app's volumes. One container with CL_ROLE=all (the default) also still works.
x-context-layer: &context-layer
  image: context-layer:0.6.0
  restart: unless-stopped
  depends_on:
    db: { condition: service_healthy }
    qdrant: { condition: service_started }
  extra_hosts:
    - "host.docker.internal:host-gateway"    # lets optional AI extraction reach a local model (Ollama) on this machine
  volumes:
    - documents:/app/documents
    - tables:/app/data
    - outputs:/app/outputs
    - app_data:/app/var
    - semantic_layer:/app/semantic_layer     # reviewed definitions; approvals in the app persist here
    - models:/models

x-context-layer-env: &context-layer-env
      CL_PUBLIC_HOSTS: ${CL_PUBLIC_HOSTS:-}
      CL_PUBLIC_URL: ${CL_PUBLIC_URL:-}
      CL_DATABASE_URL: postgresql://rag:${CL_DB_PASSWORD:?set CL_DB_PASSWORD in .env}@db:5432/contextlayer
      GRAPH_PG_DSN: host=db port=5432 dbname=contextlayer user=rag password=${CL_DB_PASSWORD:?set CL_DB_PASSWORD in .env}
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${CL_QDRANT_API_KEY:?set CL_QDRANT_API_KEY in .env}
      CL_SECRET_KEY: ${CL_SECRET_KEY:-}
      CL_SIGNUP: ${CL_SIGNUP:-invite}
      CL_GRAPH_MODE: ${CL_GRAPH_MODE:-}

services:
  app:
    <<: *context-layer
    build: .
    ports:
      - "${CL_BIND:-127.0.0.1}:${CL_PORT:-8080}:8080"
    environment:
      <<: *context-layer-env
      CL_ROLE: api

  worker:                       # job workers + scheduler; no ports. Scale with: docker compose up -d --scale worker=2
    <<: *context-layer
    command: ["python", "-m", "app.worker"]
    environment:
      <<: *context-layer-env
      CL_ROLE: worker
    healthcheck:
      test: ["CMD-SHELL", "test -n \"$$(find /tmp/cl-worker-alive -mmin -2 2>/dev/null)\""]
      interval: 30s
      timeout: 5s
      start_period: 120s

  db:                           # PostgreSQL 17 + Apache AGE + pgvector. Not published outside Docker.
    build: ./db
    image: context-layer-db:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: ${CL_DB_PASSWORD:?set CL_DB_PASSWORD in .env}
      POSTGRES_DB: contextlayer
    command: ["postgres", "-c", "shared_preload_libraries=age", "-c", "work_mem=64MB", "-c", "maintenance_work_mem=256MB"]
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d contextlayer"]
      interval: 5s
      retries: 30

  qdrant:                       # search index (dense + BM25 vectors). Not published outside Docker.
    image: qdrant/qdrant:v1.19.1
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${CL_QDRANT_API_KEY:?set CL_QDRANT_API_KEY in .env}
    volumes:
      - qdrant_data:/qdrant/storage

  # ---- optional: publish ONLY the MCP endpoint on the internet through Cloudflare (no open ports) ----
  # Quick test (random https://*.trycloudflare.com address, changes on every start, no account needed):
  #   .env: CL_PUBLIC_HOSTS=*.trycloudflare.com      then: docker compose --profile quicktunnel up -d
  #   The address appears in Settings and on the Agents page.
  quicktunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["quicktunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 --url http://app:8080
    depends_on: [app]

  # Fixed address (Cloudflare account + a domain on Cloudflare): create a tunnel in the Cloudflare dashboard,
  # public hostname -> http://app:8080, then in .env: CLOUDFLARE_TUNNEL_TOKEN=..., CL_PUBLIC_HOSTS=<hostname>,
  # CL_PUBLIC_URL=https://<hostname>      then: docker compose --profile tunnel up -d
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on: [app]

volumes:
  documents:
  tables:
  outputs:
  app_data:
  semantic_layer:
  models:
  db_data:
  qdrant_data:
