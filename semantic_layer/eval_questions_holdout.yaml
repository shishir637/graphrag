# Held-out gold set for the rule-based planner: written before the planner was run on it, never tuned on.
as_of: 2026-11-24
questions:
  - {id: h01, kind: simple, question: "Total net revenue for calendar year 2024", gold: {metrics: [net_revenue], start_date: 2024-01-01, end_date: 2024-12-31}}
  - {id: h02, kind: filter, question: "How many orders came through the app in FY2025-26?", gold: {metrics: [order_count], filters: [{dimension: orders.channel, values: [app]}], start_date: 2025-04-01, end_date: 2026-03-31}}
  - {id: h03, kind: breakdown, question: "Gross revenue split by sales channel", gold: {metrics: [gross_revenue], dimensions: [orders.channel]}}
  - {id: h04, kind: breakdown, question: "Quarterly order count for 2025", gold: {metrics: [order_count], dimensions: [orders.order_date__quarter], start_date: 2025-01-01, end_date: 2025-12-31}}
  - {id: h05, kind: top_n, question: "Which 2 regions had the highest net revenue last year?", gold: {metrics: [net_revenue], dimensions: [regions.region_name], order_by: [-net_revenue], limit: 2, start_date: 2025-01-01, end_date: 2025-12-31}}
  - {id: h06, kind: filter, question: "Average order value for Enterprise customers in Mumbai", gold: {metrics: [average_order_value], filters: [{dimension: customers.segment, values: [Enterprise]}, {dimension: customers.city, values: [Mumbai]}]}}
  - {id: h07, kind: breakdown, question: "Refunds by region in FY2024-25", gold: {metrics: [refunds], dimensions: [regions.region_name], start_date: 2024-04-01, end_date: 2025-03-31}}
  - {id: h08, kind: breakdown, question: "How many new customers signed up each month in 2026?", gold: {metrics: [new_customers], dimensions: [customers.signup_date__month], start_date: 2026-01-01, end_date: 2026-12-31}}
  - {id: h09, kind: breakdown, question: "Units sold of Electronics by region", gold: {metrics: [units_sold], dimensions: [regions.region_name], filters: [{dimension: products.category, values: [Electronics]}]}}
  - {id: h10, kind: breakdown, question: "Return rate by customer segment", gold: {metrics: [return_rate], dimensions: [customers.segment]}}
  - {id: h11, kind: filter, question: "Active customers in Delhi last quarter", gold: {metrics: [active_customers], filters: [{dimension: customers.city, values: [Delhi]}], start_date: 2026-07-01, end_date: 2026-09-30}}
  - {id: h12, kind: filter, question: "Net revenue in Kolkata and Chennai", gold: {metrics: [net_revenue], filters: [{dimension: customers.city, op: in, values: [Kolkata, Chennai]}]}}
  - {id: h13, kind: unanswerable, question: "What is the headcount of our sales team?"}
  - {id: h14, kind: unanswerable, question: "Customer churn rate last year"}
  - {id: h15, kind: top_n, question: "Product revenue for the top 5 products in FY2025-26", gold: {metrics: [product_revenue], dimensions: [products.product_name], order_by: [-product_revenue], limit: 5, start_date: 2025-04-01, end_date: 2026-03-31}}
  - {id: h16, kind: synonym, question: "Turnover in H1 2026", gold: {metrics: [net_revenue], start_date: 2026-01-01, end_date: 2026-06-30}}
  - {id: h17, kind: synonym, question: "orders from Bombay in October 2026", gold: {metrics: [order_count], filters: [{dimension: customers.city, values: [Mumbai]}], start_date: 2026-10-01, end_date: 2026-10-31}}
  - {id: h18, kind: synonym, question: "basket size by channel this year", gold: {metrics: [average_order_value], dimensions: [orders.channel], start_date: 2026-01-01, end_date: 2026-12-31}}
  - {id: h19, kind: breakdown, question: "Net revenue running total by month in 2026", gold: {metrics: [cumulative_net_revenue], dimensions: [orders.order_date__month], start_date: 2026-01-01, end_date: 2026-12-31}}
  - {id: h20, kind: simple, question: "How many returned orders were there in 2025?", gold: {metrics: [returned_orders], start_date: 2025-01-01, end_date: 2025-12-31}}
  - {id: h21, kind: top_n, question: "Which city has the fewest active customers?", gold: {metrics: [active_customers], dimensions: [customers.city], order_by: [active_customers], limit: 1}}
  - {id: h22, kind: multi_metric, question: "Gross revenue and refunds by fiscal year", gold: {metrics: [gross_revenue, refunds], dimensions: [orders.order_date__fiscal_year]}}
  - {id: h23, kind: disallowed, question: "sales for gadgets in 2026", gold: {metrics: [product_revenue], filters: [{dimension: products.category, values: [Electronics]}], start_date: 2026-01-01, end_date: 2026-12-31}}
  - {id: h24, kind: unanswerable, question: "What is the marketing budget?"}
  - {id: h25, kind: synonym, question: "ARPU last fiscal year", gold: {metrics: [revenue_per_customer], start_date: 2025-04-01, end_date: 2026-03-31}}
