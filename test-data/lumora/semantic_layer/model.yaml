# Reviewed semantic model (source of truth). Changes go through a pull request.
# Drafted by `rag.py sl-model`; reviewer fixes: unit_price and discount aggregate with avg, not sum.
version: 1
entities:
  - name: customers
    table: customers
    label: Customers
    description: One record per customer, with their location, business segment and signup date.
    primary_key: customer_id
    dimensions:
      - name: customer_id
        column: customer_id
        type: key
        label: Customer ID
        description: Unique identifier for each customer (e.g., C0001 to C0600).
      - name: customer_name
        column: customer_name
        type: text
        label: Customer Name
        description: Full name of the customer; names are not unique across customers.
      - name: city
        column: city
        type: category
        label: City
        description: City where the customer is located, one of 12 Indian cities such as Bengaluru, Mumbai and
          Delhi.
      - name: region_id
        column: region_id
        type: key
        label: Region ID
        description: Identifier of the sales region the customer belongs to (R01 to R04).
      - name: segment
        column: segment
        type: category
        label: Customer Segment
        description: 'Business segment of the customer: Consumer, Small Business or Enterprise.'
      - name: signup_date
        column: signup_date
        type: time
        label: Signup Date
        description: Date the customer signed up, ranging from 2024-01-01 to 2026-10-18.
    measures:
      - name: customers_count
        column: customer_id
        agg: count_distinct
        label: Customer Count
        description: Number of customers.
  - name: order_items
    table: order_items
    label: Order Line Items
    description: Individual product lines within orders, with quantity, price and discount.
    primary_key: order_item_id
    dimensions:
      - name: order_item_id
        column: order_item_id
        type: key
        label: Order Item ID
        description: Unique identifier for each order line item.
      - name: order_id
        column: order_id
        type: key
        label: Order ID
        description: Identifier of the order this line item belongs to.
      - name: product_id
        column: product_id
        type: key
        label: Product ID
        description: Identifier of the product purchased on this line.
    measures:
      - name: order_items_count
        column: order_item_id
        agg: count_distinct
        label: Line Item Count
        description: Number of order line items.
      - name: quantity
        column: quantity
        agg: sum
        label: Quantity
        description: Number of units purchased on the line, between 1 and 3.
      - name: unit_price
        column: unit_price
        agg: avg
        label: Line Unit Price
        description: Price per unit charged on the line, ranging from 540 to 32,400 (currency not stated, 
          likely INR).
      - name: discount
        column: discount
        agg: avg
        label: Discount Rate
        description: 'Fractional discount applied to the line: 0, 0.05 or 0.10 (0%, 5% or 10%).'
  - name: orders
    table: orders
    label: Orders
    description: Customer orders with date, sales channel, status, order value and refunds.
    primary_key: order_id
    dimensions:
      - name: order_id
        column: order_id
        type: key
        label: Order ID
        description: Unique identifier for each order.
      - name: customer_id
        column: customer_id
        type: key
        label: Customer ID
        description: Identifier of the customer who placed the order; some values (e.g., C9999) do not match a
          known customer.
      - name: order_date
        column: order_date
        type: time
        label: Order Date
        description: Date the order was placed, ranging from 2024-04-01 to 2026-11-18.
      - name: status
        column: status
        type: category
        label: Order Status
        description: 'Outcome of the order: completed, cancelled or returned.'
      - name: channel
        column: channel
        type: category
        label: Sales Channel
        description: 'Channel through which the order was placed: web, app or store.'
    measures:
      - name: orders_count
        column: order_id
        agg: count_distinct
        label: Order Count
        description: Number of orders.
      - name: amount
        column: amount
        agg: sum
        label: Order Amount
        description: Total value of the order, ranging from 486 to 261,770 (currency not stated, likely INR).
      - name: refund_amount
        column: refund_amount
        agg: sum
        label: Refund Amount
        description: Amount refunded on the order, from 0 up to 170,949; 0 means no refund.
  - name: products
    table: products
    label: Products
    description: Catalog of 40 products with their category and list price.
    primary_key: product_id
    dimensions:
      - name: product_id
        column: product_id
        type: key
        label: Product ID
        description: Unique identifier for each product (P001 to P040).
      - name: product_name
        column: product_name
        type: category
        label: Product Name
        description: Name of the product, e.g., 'Apparel item 04'.
      - name: category
        column: category
        type: category
        label: Product Category
        description: 'Product category: Apparel, Books, Electronics, Home or Office.'
    measures:
      - name: products_count
        column: product_id
        agg: count_distinct
        label: Product Count
        description: Number of products.
      - name: unit_price
        column: unit_price
        agg: avg
        label: List Unit Price
        description: Catalog price per unit, ranging from 540 to 32,400 (currency not stated, likely INR).
  - name: regions
    table: regions
    label: Regions
    description: Sales regions used to group customers geographically.
    primary_key: region_id
    dimensions:
      - name: region_id
        column: region_id
        type: key
        label: Region ID
        description: Unique identifier for each region (R01 to R04).
      - name: region_name
        column: region_name
        type: category
        label: Region Name
        description: 'Name of the region: East, North, South or West.'
      - name: country
        column: country
        type: category
        label: Country
        description: Country of the region; currently always India.
    measures:
      - name: regions_count
        column: region_id
        agg: count_distinct
        label: Region Count
        description: Number of regions.
  - name: lumora_customers
    table: lumora_customers
    label: Lumora customers
    description: One row per record of lumora_customers (20 rows). Drafted from the data profile; review.
    primary_key: customer_id
    dimensions:
      - name: customer_id
        column: customer_id
        type: key
        label: Customer id
        description: Customer id (varchar, 20 distinct values).
      - name: name
        column: name
        type: category
        label: Name
        description: Name (varchar, 20 distinct values).
      - name: tier
        column: tier
        type: category
        label: Tier
        description: Tier (varchar, 3 distinct values).
      - name: region
        column: region
        type: category
        label: Region
        description: Region (varchar, 4 distinct values).
      - name: industry
        column: industry
        type: category
        label: Industry
        description: Industry (varchar, 4 distinct values).
      - name: customer_since
        column: customer_since
        type: time
        label: Customer since
        description: Customer since (date, 20 distinct values).
    measures:
      - name: row_count
        column: customer_id
        agg: count
        label: Lumora customers rows
        description: Number of rows in lumora_customers.
  - name: lumora_employees__departments
    table: lumora_employees__departments
    label: Lumora employees departments
    description: One row per record of lumora_employees__departments (5 rows). Drafted from the data profile; 
      review.
    primary_key: department_id
    dimensions:
      - name: department_id
        column: department_id
        type: key
        label: Department id
        description: Department id (varchar, 5 distinct values).
      - name: department_name
        column: department_name
        type: category
        label: Department name
        description: Department name (varchar, 5 distinct values).
      - name: head_employee_id
        column: head_employee_id
        type: key
        label: Head employee id
        description: Head employee id (varchar, 5 distinct values).
      - name: cost_center
        column: cost_center
        type: category
        label: Cost center
        description: Cost center (varchar, 5 distinct values).
    measures:
      - name: row_count
        column: department_id
        agg: count
        label: Lumora employees departments rows
        description: Number of rows in lumora_employees__departments.
  - name: lumora_employees__employees
    table: lumora_employees__employees
    label: Lumora employees employees
    description: One row per record of lumora_employees__employees (120 rows). Drafted from the data profile; 
      review.
    primary_key: employee_id
    dimensions:
      - name: employee_id
        column: employee_id
        type: key
        label: Employee id
        description: Employee id (varchar, 120 distinct values).
      - name: full_name
        column: full_name
        type: text
        label: Full name
        description: Full name (varchar, 99 distinct values).
      - name: department_id
        column: department_id
        type: key
        label: Department id
        description: Department id (varchar, 5 distinct values).
      - name: title
        column: title
        type: category
        label: Title
        description: Title (varchar, 15 distinct values).
      - name: city
        column: city
        type: category
        label: City
        description: City (varchar, 5 distinct values).
      - name: hire_date
        column: hire_date
        type: time
        label: Hire date
        description: Hire date (date, 116 distinct values).
    measures:
      - name: row_count
        column: employee_id
        agg: count
        label: Lumora employees employees rows
        description: Number of rows in lumora_employees__employees.
  - name: lumora_invoices
    table: lumora_invoices
    label: Lumora invoices
    description: One row per record of lumora_invoices (600 rows). Drafted from the data profile; review.
    primary_key: invoice_id
    dimensions:
      - name: invoice_id
        column: invoice_id
        type: key
        label: Invoice id
        description: Invoice id (varchar, 600 distinct values).
      - name: customer_id
        column: customer_id
        type: key
        label: Customer id
        description: Customer id (varchar, 20 distinct values).
      - name: issued_date
        column: issued_date
        type: time
        label: Issued date
        description: Issued date (date, 395 distinct values).
      - name: due_date
        column: due_date
        type: time
        label: Due date
        description: Due date (date, 395 distinct values).
      - name: amount
        column: amount
        type: number
        label: Amount
        description: Amount (double, 600 distinct values).
      - name: status
        column: status
        type: category
        label: Status
        description: Status (varchar, 3 distinct values).
      - name: product
        column: product
        type: category
        label: Product
        description: Product (varchar, 3 distinct values).
    measures:
      - name: row_count
        column: invoice_id
        agg: count
        label: Lumora invoices rows
        description: Number of rows in lumora_invoices.
      - name: total_amount
        column: amount
        agg: sum
        label: Total amount
        description: Sum of amount.
  - name: lumora_tickets
    table: lumora_tickets
    label: Lumora tickets
    description: One row per record of lumora_tickets (400 rows). Drafted from the data profile; review.
    primary_key: ticket_id
    dimensions:
      - name: ticket_id
        column: ticket_id
        type: key
        label: Ticket id
        description: Ticket id (varchar, 400 distinct values).
      - name: opened_at
        column: opened_at
        type: time
        label: Opened at
        description: Opened at (date, 295 distinct values).
      - name: priority
        column: priority
        type: category
        label: Priority
        description: Priority (varchar, 4 distinct values).
      - name: product
        column: product
        type: category
        label: Product
        description: Product (varchar, 3 distinct values).
      - name: channel
        column: channel
        type: category
        label: Channel
        description: Channel (varchar, 3 distinct values).
      - name: assignee_id
        column: assignee_id
        type: key
        label: Assignee id
        description: Assignee id (varchar, 23 distinct values).
      - name: resolution_hours
        column: resolution_hours
        type: number
        label: Resolution hours
        description: Resolution hours (bigint, 7 distinct values).
      - name: csat
        column: csat
        type: number
        label: Csat
        description: Csat (bigint, 4 distinct values).
      - name: customer_customer_id
        column: customer_customer_id
        type: key
        label: Customer customer id
        description: Customer customer id (varchar, 20 distinct values).
      - name: customer_name
        column: customer_name
        type: category
        label: Customer name
        description: Customer name (varchar, 20 distinct values).
      - name: customer_tier
        column: customer_tier
        type: category
        label: Customer tier
        description: Customer tier (varchar, 3 distinct values).
    measures:
      - name: row_count
        column: ticket_id
        agg: count
        label: Lumora tickets rows
        description: Number of rows in lumora_tickets.
      - name: total_resolution_hours
        column: resolution_hours
        agg: sum
        label: Total resolution hours
        description: Sum of resolution_hours.
      - name: total_csat
        column: csat
        agg: sum
        label: Total csat
        description: Sum of csat.
joins:
  - from_entity: customers
    from_column: region_id
    to_entity: regions
    to_column: region_id
    relationship: many_to_one
  - from_entity: order_items
    from_column: order_id
    to_entity: orders
    to_column: order_id
    relationship: many_to_one
  - from_entity: order_items
    from_column: product_id
    to_entity: products
    to_column: product_id
    relationship: many_to_one
  - from_entity: orders
    from_column: customer_id
    to_entity: customers
    to_column: customer_id
    relationship: many_to_one
  - from_entity: lumora_employees__employees
    from_column: department_id
    to_entity: lumora_employees__departments
    to_column: department_id
    relationship: many_to_one
  - from_entity: lumora_invoices
    from_column: customer_id
    to_entity: lumora_customers
    to_column: customer_id
    relationship: many_to_one
  - from_entity: lumora_tickets
    from_column: assignee_id
    to_entity: lumora_employees__employees
    to_column: employee_id
    relationship: many_to_one
  - from_entity: lumora_tickets
    from_column: customer_customer_id
    to_entity: lumora_customers
    to_column: customer_id
    relationship: many_to_one
